name: Chain Agentic CodeQL Phases

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional pull request number to reconcile. Leave empty to scan all open PRs.
        required: false
        type: string
  schedule:
    - cron: "*/30 * * * *"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .codeql/models/generated-sql-injection-sinks.yaml
      - docs/codeql-gap-analysis.md
  workflow_run:
    workflows:
      - "DETECT CodeQL Coverage Gaps (SQL Injection)"
      - "PROPOSE CodeQL Model Pack (SQL Injection) — MERGE MODE"
    types:
      - completed

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: agentic-codeql-phase-chain-${{ github.event_name }}-${{ github.event.workflow_run.id || github.event.pull_request.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch-next-phase:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve next phase
        id: phase
        shell: bash
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: |
          case "$WORKFLOW_NAME" in
            "DETECT CodeQL Coverage Gaps (SQL Injection)")
              echo "next_workflow=propose-model-pack.lock.yml" >> "$GITHUB_OUTPUT"
              echo "next_phase=PROPOSE" >> "$GITHUB_OUTPUT"
              ;;
            "PROPOSE CodeQL Model Pack (SQL Injection) — MERGE MODE")
              echo "next_workflow=verify-model-pack.lock.yml" >> "$GITHUB_OUTPUT"
              echo "next_phase=VERIFY" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "No chained phase for workflow: $WORKFLOW_NAME"
              echo "next_workflow=" >> "$GITHUB_OUTPUT"
              echo "next_phase=" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Download agent artifact
        if: ${{ steps.phase.outputs.next_workflow != '' }}
        id: artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/agent-artifact"
          mkdir -p "$artifact_dir"

          gh run download "$RUN_ID" \
            --repo "$REPOSITORY" \
            --name agent \
            --dir "$artifact_dir"

          safeoutputs_path="$(find "$artifact_dir" -type f -name safeoutputs.jsonl | head -n 1)"
          if [ -z "$safeoutputs_path" ]; then
            echo "No safeoutputs.jsonl found in agent artifact; skipping chain."
            echo "safeoutputs_path=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "safeoutputs_path=$safeoutputs_path" >> "$GITHUB_OUTPUT"

      - name: Resolve created PR branch
        if: ${{ steps.artifact.outputs.safeoutputs_path != '' }}
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          SAFEOUTPUTS_PATH: ${{ steps.artifact.outputs.safeoutputs_path }}
          NEXT_PHASE: ${{ steps.phase.outputs.next_phase }}
        run: |
          set -euo pipefail

          output_json="$(node <<'NODE'
          const fs = require('fs');

          const file = process.env.SAFEOUTPUTS_PATH;
          const lines = fs.readFileSync(file, 'utf8')
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);

          for (const line of lines) {
            const item = JSON.parse(line);
            if (item.type === 'create_pull_request' && item.branch) {
              process.stdout.write(JSON.stringify({
                branch: item.branch,
                title: item.title || '',
                baseBranch: item.base_branch || 'main'
              }));
              process.exit(0);
            }
          }
          NODE
          )"

          if [ -z "$output_json" ]; then
            echo "No create_pull_request branch found; skipping chain."
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          branch="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).branch)' "$output_json")"
          title="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).title)' "$output_json")"
          base_branch="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).baseBranch)' "$output_json")"

          branch_exists=false
          if gh api "repos/$REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            branch_exists=true
          fi

          if [ "$branch_exists" = "true" ] && [ "$NEXT_PHASE" != "VERIFY" ]; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$branch_exists" = "true" ]; then
            echo "Safe output branch '$branch' exists, but VERIFY requires the actual model PR branch; resolving PR head branch."
          else
            echo "Safe output branch '$branch' does not exist; resolving actual PR head branch."
          fi

          prs_json="$(gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --base "$base_branch" \
            --json number,title,headRefName,headRepository,url \
            --limit 50)"
          prs_json_path="$RUNNER_TEMP/open-prs.json"
          printf '%s' "$prs_json" > "$prs_json_path"

          resolved_branch="$(PRS_JSON_PATH="$prs_json_path" REQUESTED_BRANCH="$branch" PR_TITLE="$title" node <<'NODE'
          const fs = require('fs');

          const prs = JSON.parse(fs.readFileSync(process.env.PRS_JSON_PATH, 'utf8'));
          const requestedBranch = process.env.REQUESTED_BRANCH;
          const title = process.env.PR_TITLE;
          const repository = process.env.REPOSITORY;

          const matches = prs.filter((pr) => {
            const sameRepo = pr.headRepository && pr.headRepository.nameWithOwner === repository;
            const titleMatches = !title || pr.title === title;
            const branchMatches = pr.headRefName === requestedBranch || pr.headRefName.startsWith(`${requestedBranch}-`);
            return sameRepo && titleMatches && branchMatches;
          });

          matches.sort((a, b) => b.number - a.number);

          if (matches[0]) {
            process.stdout.write(matches[0].headRefName);
          }
          NODE
          )"

          if [ -z "$resolved_branch" ]; then
            if [ "$branch_exists" = "true" ]; then
              echo "Could not resolve a suffixed PR branch; falling back to existing branch '$branch'."
              echo "branch=$branch" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Could not resolve an open PR branch for safe output branch '$branch'."
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Resolved actual PR branch: $resolved_branch"
          echo "branch=$resolved_branch" >> "$GITHUB_OUTPUT"

      - name: Dispatch next phase
        if: ${{ steps.branch.outputs.branch != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          NEXT_WORKFLOW: ${{ steps.phase.outputs.next_workflow }}
          NEXT_PHASE: ${{ steps.phase.outputs.next_phase }}
          NEXT_REF: ${{ steps.branch.outputs.branch }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          aw_context="{\"chained_from_run_id\":\"$SOURCE_RUN_ID\",\"chained_from_run_url\":\"$SOURCE_RUN_URL\"}"

          echo "Dispatching $NEXT_PHASE via $NEXT_WORKFLOW on $NEXT_REF"
          gh workflow run "$NEXT_WORKFLOW" \
            --repo "$REPOSITORY" \
            --ref "$NEXT_REF" \
            -f aw_context="$aw_context"

  dispatch-verify-from-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Read analysis state
        id: analysis
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          if ! content="$(gh api "repos/$REPOSITORY/contents/docs/codeql-gap-analysis.md?ref=$HEAD_REF" --jq '.content' 2>/dev/null)"; then
            echo "docs/codeql-gap-analysis.md not found on $HEAD_REF; skipping."
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          decoded="$(printf '%s' "$content" | base64 --decode)"
          status="$(printf '%s\n' "$decoded" | awk -F: '{ key=$1; gsub(/^[ \t*]+|[ \t*]+$/, "", key); if (tolower(key) == "status") { value=$2; gsub(/^[ \t]+|[ \t]+$/, "", value); status=value } } END { print status }')"
          next="$(printf '%s\n' "$decoded" | awk -F: '{ key=$1; gsub(/^[ \t*]+|[ \t*]+$/, "", key); if (tolower(key) == "next") { value=$2; gsub(/^[ \t]+|[ \t]+$/, "", value); next_state=value } } END { print next_state }')"

          echo "Current analysis state: status=$status next=$next"

          if [ "$status" = "MODEL_GENERATED" ] && [ "$next" = "VERIFY" ]; then
            echo "should_dispatch=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR is not ready for VERIFY; skipping."
            echo "should_dispatch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch VERIFY
        if: ${{ steps.analysis.outputs.should_dispatch == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          NEXT_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail

          aw_context="{\"chained_from_pr_number\":\"$PR_NUMBER\",\"chained_from_pr_url\":\"$PR_URL\"}"

          echo "Dispatching VERIFY via verify-model-pack.lock.yml on $NEXT_REF"
          gh workflow run verify-model-pack.lock.yml \
            --repo "$REPOSITORY" \
            --ref "$NEXT_REF" \
            -f aw_context="$aw_context"

  reconcile-ready-model-prs:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile PRs ready for VERIFY
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN || github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -euo pipefail

          prs_json="$(gh pr list \
            --repo "$REPOSITORY" \
            --state open \
            --json number,title,headRefName,headRefOid,headRepository,url \
            --limit 100)"

          prs_path="$RUNNER_TEMP/open-prs.json"
          printf '%s' "$prs_json" > "$prs_path"

          candidates_path="$RUNNER_TEMP/verify-candidates.json"
          REQUESTED_PR="$REQUESTED_PR" REPOSITORY="$REPOSITORY" PRS_PATH="$prs_path" node <<'NODE' > "$candidates_path"
          const fs = require('fs');

          const requestedPr = process.env.REQUESTED_PR;
          const repository = process.env.REPOSITORY;
          const prs = JSON.parse(fs.readFileSync(process.env.PRS_PATH, 'utf8'));

          const candidates = prs.filter((pr) => {
            const sameRepo = pr.headRepository && pr.headRepository.nameWithOwner === repository;
            const requested = !requestedPr || String(pr.number) === String(requestedPr);
            return sameRepo && requested;
          });

          process.stdout.write(JSON.stringify(candidates));
          NODE

          candidate_count="$(node -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).length))' "$candidates_path")"
          echo "Reconciling $candidate_count candidate PR(s)."

          node -e "
          const fs = require('fs');
          const candidates = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
          for (const candidate of candidates) {
            process.stdout.write(candidate.number + '\\t' + candidate.headRefName + '\\t' + candidate.headRefOid + '\\t' + candidate.url + '\\n');
          }
          " "$candidates_path" > "$RUNNER_TEMP/candidate-lines.txt"

          while IFS=$'\t' read -r pr_number head_ref head_sha pr_url; do
            if [ -z "${pr_number:-}" ]; then
              continue
            fi

            echo "Checking PR #$pr_number ($head_ref)"

            if ! gh api "repos/$REPOSITORY/contents/.codeql/models/generated-sql-injection-sinks.yaml?ref=$head_ref" >/dev/null 2>&1; then
              echo "Generated model file not found on $head_ref; skipping."
              continue
            fi

            if ! content="$(gh api "repos/$REPOSITORY/contents/docs/codeql-gap-analysis.md?ref=$head_ref" --jq '.content' 2>/dev/null)"; then
              echo "docs/codeql-gap-analysis.md not found on $head_ref; skipping."
              continue
            fi

            decoded="$(printf '%s' "$content" | base64 --decode)"
            status="$(printf '%s\n' "$decoded" | awk -F: '{ key=$1; gsub(/^[ \t*]+|[ \t*]+$/, "", key); if (tolower(key) == "status") { value=$2; gsub(/^[ \t]+|[ \t]+$/, "", value); status=value } } END { print status }')"
            next="$(printf '%s\n' "$decoded" | awk -F: '{ key=$1; gsub(/^[ \t*]+|[ \t*]+$/, "", key); if (tolower(key) == "next") { value=$2; gsub(/^[ \t]+|[ \t]+$/, "", value); next_state=value } } END { print next_state }')"
            echo "Current analysis state: status=$status next=$next"

            if [ "$status" != "MODEL_GENERATED" ] || [ "$next" != "VERIFY" ]; then
              echo "PR #$pr_number is not ready for VERIFY; skipping."
              continue
            fi

            runs_json="$(gh api "repos/$REPOSITORY/actions/workflows/verify-model-pack.lock.yml/runs?branch=$head_ref&per_page=20")"
            active_runs="$(RUNS_JSON="$runs_json" node -e 'const runs = JSON.parse(process.env.RUNS_JSON).workflow_runs || []; process.stdout.write(String(runs.filter((run) => run.status !== "completed").length));')"
            if [ "$active_runs" != "0" ]; then
              echo "VERIFY is already active for $head_ref; skipping."
              continue
            fi

            verified_head="$(RUNS_JSON="$runs_json" HEAD_SHA="$head_sha" node -e 'const runs = JSON.parse(process.env.RUNS_JSON).workflow_runs || []; const headSha = process.env.HEAD_SHA; process.stdout.write(String(runs.filter((run) => run.head_sha === headSha && run.conclusion === "success").length));')"
            if [ "$verified_head" != "0" ]; then
              echo "VERIFY already succeeded for PR #$pr_number head $head_sha; skipping."
              continue
            fi

            aw_context="{\"reconciled_from_pr_number\":\"$pr_number\",\"reconciled_from_pr_url\":\"$pr_url\"}"

            echo "Dispatching VERIFY for PR #$pr_number on $head_ref"
            gh workflow run verify-model-pack.lock.yml \
              --repo "$REPOSITORY" \
              --ref "$head_ref" \
              -f aw_context="$aw_context"
          done < "$RUNNER_TEMP/candidate-lines.txt"
