name: CodeQL Action Init

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "pom.xml"
      - ".github/workflows/codeql-action-init.yml"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-with-codeql-action:
    name: CodeQL Action (JDK ${{ matrix.java-version }}, release ${{ matrix.java-release }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: "8"
            java-release: "8"
            allow_failure: true
          - java-version: "17"
            java-release: "17"
            allow_failure: false
          - java-version: "21"
            java-release: "21"
            allow_failure: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: manual

      - name: Build with Maven
        run: mvn -B clean package -Dmaven.compiler.release=${{ matrix.java-release }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-jdk-${{ matrix.java-version }}-release-${{ matrix.java-release }}"

      - name: Write matrix summary
        if: always()
        run: |
          {
            echo "# CodeQL Action Init - JDK ${{ matrix.java-version }}, Release ${{ matrix.java-release }}"
            echo
            echo "Allowed failure: ${{ matrix.allow_failure && 'yes' || 'no' }}"
            echo "Build JDK: ${{ matrix.java-version }}"
            echo "Compiler release: ${{ matrix.java-release }}"
            echo
            echo "This workflow uses github/codeql-action/init and github/codeql-action/analyze."
          } >> "$GITHUB_STEP_SUMMARY"