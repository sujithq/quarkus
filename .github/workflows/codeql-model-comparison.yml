name: CodeQL Model Comparison

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "ql/**"
      - "pom.xml"
      - "qlpack.yml"
      - "codeql-pack.lock.yml"
      - ".github/workflows/codeql-model-comparison.yml"

permissions:
  contents: read

jobs:
  compare-codeql-results:
    name: Baseline vs modeled CodeQL (JDK ${{ matrix.java-version }}, release ${{ matrix.java-release }})
    runs-on: ubuntu-latest
    env:
      CODEQL_RESULTS_DIR: codeql-workflow-results
    strategy:
      fail-fast: false
      matrix:
        include:
          - java-version: "8"
            java-release: "8"
            allow_failure: true
          - java-version: "17"
            java-release: "17"
            allow_failure: false
          - java-version: "21"
            java-release: "21"
            allow_failure: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}
          cache: maven

      - name: Install CodeQL CLI
        run: |
          rm -rf "$CODEQL_RESULTS_DIR"
          mkdir -p "$RUNNER_TEMP/codeql-bundle"
          curl -L -o "$RUNNER_TEMP/codeql-bundle.tar.gz" \
            https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz
          tar -xzf "$RUNNER_TEMP/codeql-bundle.tar.gz" -C "$RUNNER_TEMP/codeql-bundle"
          echo "$RUNNER_TEMP/codeql-bundle/codeql" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/codeql-bundle/codeql/codeql" --version

      - name: Create CodeQL database
        id: create_database
        continue-on-error: true
        run: |
          codeql database create db-quarkus \
            --overwrite \
            --language=java \
            --command="mvn -B clean package -Dmaven.compiler.release=${{ matrix.java-release }}"

      - name: Run baseline CodeQL analysis
        id: baseline_analysis
        if: steps.create_database.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p "$CODEQL_RESULTS_DIR"
          codeql database analyze db-quarkus codeql/java-queries \
            --format=sarif-latest \
            --output="$CODEQL_RESULTS_DIR/baseline.sarif" \
            --threads=0

      - name: Run modeled CodeQL analysis
        id: modeled_analysis
        if: steps.create_database.outcome == 'success'
        continue-on-error: true
        run: |
          codeql database analyze db-quarkus codeql/java-queries \
            --model-packs=local/quarkus-models \
            --additional-packs=. \
            --rerun \
            --format=sarif-latest \
            --output="$CODEQL_RESULTS_DIR/modeled.sarif" \
            --threads=0

      - name: Compare SARIF results
        if: always()
        env:
          JAVA_VERSION: ${{ matrix.java-version }}
          JAVA_RELEASE: ${{ matrix.java-release }}
          ALLOW_FAILURE: ${{ matrix.allow_failure }}
          CODEQL_RESULTS_DIR: ${{ env.CODEQL_RESULTS_DIR }}
          DATABASE_OUTCOME: ${{ steps.create_database.outcome }}
          BASELINE_OUTCOME: ${{ steps.baseline_analysis.outcome }}
          MODELED_OUTCOME: ${{ steps.modeled_analysis.outcome }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const resultsDirectory = process.env.CODEQL_RESULTS_DIR;
          fs.mkdirSync(resultsDirectory, { recursive: true });

          const baselinePath = `${resultsDirectory}/baseline.sarif`;
          const modeledPath = `${resultsDirectory}/modeled.sarif`;
          const reportPath = `${resultsDirectory}/codeql-comparison.md`;
          const jsonPath = `${resultsDirectory}/codeql-comparison.json`;
          const javaVersion = process.env.JAVA_VERSION;
          const javaRelease = process.env.JAVA_RELEASE;
          const allowFailure = process.env.ALLOW_FAILURE === 'true';
          const databaseOutcome = process.env.DATABASE_OUTCOME || 'skipped';
          const baselineOutcome = process.env.BASELINE_OUTCOME || 'skipped';
          const modeledOutcome = process.env.MODELED_OUTCOME || 'skipped';

          function readSarif(path) {
            return JSON.parse(fs.readFileSync(path, 'utf8'));
          }

          function locationOf(result) {
            const physical = result.locations?.[0]?.physicalLocation;
            const artifact = physical?.artifactLocation?.uri || 'unknown';
            const region = physical?.region || {};
            return {
              file: artifact,
              line: region.startLine || 1,
              column: region.startColumn || 1
            };
          }

          function resultKey(result) {
            const location = locationOf(result);
            return [
              result.ruleId || result.rule?.id || 'unknown-rule',
              location.file,
              location.line,
              location.column,
              result.message?.text || ''
            ].join('|');
          }

          function collectResults(sarif) {
            return sarif.runs.flatMap((run) => run.results || []);
          }

          function escapeCommandValue(value) {
            return String(value)
              .replace(/%/g, '%25')
              .replace(/\r/g, '%0D')
              .replace(/\n/g, '%0A');
          }

          function escapeCommandProperty(value) {
            return escapeCommandValue(value)
              .replace(/:/g, '%3A')
              .replace(/,/g, '%2C');
          }

          const canCompare = fs.existsSync(baselinePath) && fs.existsSync(modeledPath);
          const baselineResults = canCompare ? collectResults(readSarif(baselinePath)) : [];
          const modeledResults = canCompare ? collectResults(readSarif(modeledPath)) : [];
          const baselineKeys = new Set(baselineResults.map(resultKey));
          const modeledKeys = new Set(modeledResults.map(resultKey));
          const newResults = modeledResults.filter((result) => !baselineKeys.has(resultKey(result)));
          const removedResults = baselineResults.filter((result) => !modeledKeys.has(resultKey(result)));

          const summary = {
            javaVersion,
            javaRelease,
            allowFailure,
            databaseOutcome,
            baselineOutcome,
            modeledOutcome,
            comparisonComplete: canCompare,
            baselineCount: baselineResults.length,
            modeledCount: modeledResults.length,
            newModeledCount: newResults.length,
            removedBaselineCount: removedResults.length,
            newModeledResults: newResults.map((result) => ({
              ruleId: result.ruleId || result.rule?.id || 'unknown-rule',
              message: result.message?.text || '',
              location: locationOf(result)
            })),
            removedBaselineResults: removedResults.map((result) => ({
              ruleId: result.ruleId || result.rule?.id || 'unknown-rule',
              message: result.message?.text || '',
              location: locationOf(result)
            }))
          };

          const lines = [
            `# CodeQL Baseline vs Modeled Comparison - JDK ${javaVersion}, Release ${javaRelease}`,
            '',
            `Allowed failure: ${summary.allowFailure ? 'yes' : 'no'}`,
            `Database creation: ${summary.databaseOutcome}`,
            `Baseline analysis: ${summary.baselineOutcome}`,
            `Modeled analysis: ${summary.modeledOutcome}`,
            `Comparison complete: ${summary.comparisonComplete ? 'yes' : 'no'}`,
            '',
            `Baseline results: ${summary.baselineCount}`,
            `Modeled results: ${summary.modeledCount}`,
            `New modeled results: ${summary.newModeledCount}`,
            `Removed baseline results: ${summary.removedBaselineCount}`,
            ''
          ];

          if (!summary.comparisonComplete) {
            lines.push('The SARIF comparison could not be completed because one or both analysis outputs were not produced.', '');
          } else if (summary.newModeledResults.length > 0) {
            lines.push('## New modeled results', '');
            for (const result of summary.newModeledResults) {
              lines.push(`- ${result.ruleId} at ${result.location.file}:${result.location.line}:${result.location.column} - ${result.message}`);
            }
            lines.push('');
          } else {
            lines.push('No modeled-only results were found.', '');
          }

          if (summary.removedBaselineResults.length > 0) {
            lines.push('## Removed baseline results', '');
            for (const result of summary.removedBaselineResults) {
              lines.push(`- ${result.ruleId} at ${result.location.file}:${result.location.line}:${result.location.column} - ${result.message}`);
            }
            lines.push('');
          }

          fs.writeFileSync(reportPath, `${lines.join('\n')}\n`);
          fs.writeFileSync(jsonPath, `${JSON.stringify(summary, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);

          const notice = `JDK ${javaVersion}, release ${javaRelease}: allowed failure ${summary.allowFailure ? 'yes' : 'no'}, database ${summary.databaseOutcome}, baseline ${summary.baselineOutcome}, modeled ${summary.modeledOutcome}, baseline results ${summary.baselineCount}, modeled results ${summary.modeledCount}, new modeled ${summary.newModeledCount}, removed baseline ${summary.removedBaselineCount}.`;
          console.log(`::notice title=${escapeCommandProperty(`CodeQL comparison JDK ${javaVersion}`)}::${escapeCommandValue(notice)}`);

          if (!summary.comparisonComplete) {
            const annotationKind = summary.allowFailure ? 'notice' : 'error';
            console.log(`::${annotationKind} title=${escapeCommandProperty(`CodeQL comparison incomplete for JDK ${javaVersion}`)}::${escapeCommandValue('One or both SARIF files were not produced. Check the database and analysis steps for this matrix entry.')}`);
          }

          for (const result of summary.newModeledResults) {
            const location = result.location;
            const message = `${result.ruleId}: ${result.message}`;
            console.log(`::warning file=${escapeCommandProperty(location.file)},line=${location.line},col=${location.column},title=${escapeCommandProperty(`New modeled CodeQL finding JDK ${javaVersion}`)}::${escapeCommandValue(message)}`);
          }
          NODE

      - name: Upload CodeQL SARIF and comparison artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-baseline-modeled-sarif-jdk-${{ matrix.java-version }}-release-${{ matrix.java-release }}
          path: |
            ${{ env.CODEQL_RESULTS_DIR }}/baseline.sarif
            ${{ env.CODEQL_RESULTS_DIR }}/modeled.sarif
            ${{ env.CODEQL_RESULTS_DIR }}/codeql-comparison.md
            ${{ env.CODEQL_RESULTS_DIR }}/codeql-comparison.json
          if-no-files-found: error

      - name: Fail matrix entry when CodeQL comparison failed
        if: always() && !matrix.allow_failure && (steps.create_database.outcome != 'success' || steps.baseline_analysis.outcome != 'success' || steps.modeled_analysis.outcome != 'success')
        run: exit 1

  summarize-codeql-matrix:
    name: Summarize CodeQL Java matrix
    runs-on: ubuntu-latest
    needs: compare-codeql-results
    if: always()

    steps:
      - name: Download CodeQL comparison artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        env:
          NODE_OPTIONS: --no-deprecation
        with:
          path: all-results

      - name: Summarize Java matrix comparison
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function findFiles(directory, fileName) {
            if (!fs.existsSync(directory)) {
              return [];
            }

            const matches = [];
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                matches.push(...findFiles(fullPath, fileName));
              } else if (entry.name === fileName) {
                matches.push(fullPath);
              }
            }
            return matches;
          }

          function escapeCommandValue(value) {
            return String(value)
              .replace(/%/g, '%25')
              .replace(/\r/g, '%0D')
              .replace(/\n/g, '%0A');
          }

          function escapeCommandProperty(value) {
            return escapeCommandValue(value)
              .replace(/:/g, '%3A')
              .replace(/,/g, '%2C');
          }

          const summaries = [];

          for (const file of findFiles('all-results', 'codeql-comparison.json')) {
            const summary = JSON.parse(fs.readFileSync(file, 'utf8'));
            summaries.push(summary);
          }

          summaries.sort((left, right) => Number(left.javaVersion) - Number(right.javaVersion) || Number(left.javaRelease) - Number(right.javaRelease));

          const lines = [
            '# CodeQL Java Matrix Summary',
            '',
            '| JDK | Release | Allowed failure | Database | Baseline | Modeled | Compared | Baseline results | Modeled results | New modeled | Removed baseline |',
            '| --- | --- | --- | --- | --- | --- | --- | ---: | ---: | ---: | ---: |'
          ];

          let hasFailure = summaries.length === 0;
          if (summaries.length === 0) {
            lines.push('| none | none | no | missing | missing | missing | no | 0 | 0 | 0 | 0 |');
            console.log(`::error title=${escapeCommandProperty('Missing CodeQL comparison reports')}::${escapeCommandValue('No comparison artifacts were found. Check the matrix jobs before this summary job.')}`);
          }

          for (const summary of summaries) {
            const javaVersion = String(summary.javaVersion);
            const javaRelease = String(summary.javaRelease);

            const failed = summary.databaseOutcome !== 'success'
              || summary.baselineOutcome !== 'success'
              || summary.modeledOutcome !== 'success'
              || !summary.comparisonComplete;
            hasFailure = hasFailure || (failed && !summary.allowFailure);

            lines.push(`| ${javaVersion} | ${javaRelease} | ${summary.allowFailure ? 'yes' : 'no'} | ${summary.databaseOutcome} | ${summary.baselineOutcome} | ${summary.modeledOutcome} | ${summary.comparisonComplete ? 'yes' : 'no'} | ${summary.baselineCount} | ${summary.modeledCount} | ${summary.newModeledCount} | ${summary.removedBaselineCount} |`);

            if (failed && summary.allowFailure) {
              console.log(`::notice title=${escapeCommandProperty(`CodeQL matrix allowed failure for JDK ${javaVersion}`)}::${escapeCommandValue(`Release ${javaRelease}: database ${summary.databaseOutcome}, baseline ${summary.baselineOutcome}, modeled ${summary.modeledOutcome}, comparison complete ${summary.comparisonComplete ? 'yes' : 'no'}.`)}`);
            } else if (failed) {
              console.log(`::error title=${escapeCommandProperty(`CodeQL matrix failed for JDK ${javaVersion}`)}::${escapeCommandValue(`Release ${javaRelease}: database ${summary.databaseOutcome}, baseline ${summary.baselineOutcome}, modeled ${summary.modeledOutcome}, comparison complete ${summary.comparisonComplete ? 'yes' : 'no'}.`)}`);
            } else {
              console.log(`::notice title=${escapeCommandProperty(`CodeQL matrix passed for JDK ${javaVersion}`)}::${escapeCommandValue(`Release ${javaRelease}: baseline ${summary.baselineCount}, modeled ${summary.modeledCount}, new modeled ${summary.newModeledCount}, removed baseline ${summary.removedBaselineCount}.`)}`);
            }
          }

          lines.push('');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);

          if (hasFailure) {
            process.exit(1);
          }
          NODE