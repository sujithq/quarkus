name: Finalize Verified CodeQL Model Pack

on:
  workflow_dispatch:
    inputs:
      verify_run_id:
        description: Optional VERIFY workflow run ID to finalize
        required: false
        type: string
      pr_number:
        description: Optional verified pull request number to finalize
        required: false
        type: string
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - "VERIFY CodeQL Model Pack (SQL Injection)"
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: finalize-verified-model-pack-${{ github.event.workflow_run.id || github.event.inputs.verify_run_id || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalizer
        uses: actions/checkout@v4

      - name: Create issue and close phase PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id || github.event.inputs.verify_run_id }}
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: node .github/scripts/finalize-verified-model-pack.js